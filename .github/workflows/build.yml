name: Build NEGA calendar feed

on:
  schedule:
    - cron: "17 10 * * *"   # daily, ~6am Eastern
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed
        run: python build_ics.py
      - name: Commit if events changed
        run: |
          git add docs/nega.ics
          if git diff --cached --quiet -I '^DTSTAMP:'; then
            echo "No event changes."
            git reset -q
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update NEGA calendar feed"
          git push
